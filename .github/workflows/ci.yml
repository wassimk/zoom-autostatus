name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - run: cargo build
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # Builds the same macOS release binaries as release.yml, without signing or
  # publishing, so pull requests prove the release build still works.
  release-build:
    name: Release Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    env:
      TARGET: ${{ matrix.target }}
      BIN: zoom-autostatus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
      - name: Build binary
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --locked --release --target "$TARGET"
      - name: Check architecture and stripping
        run: |
          BINARY="target/$TARGET/release/$BIN"
          EXPECTED_ARCH="${TARGET%%-*}"
          [ "$EXPECTED_ARCH" = "aarch64" ] && EXPECTED_ARCH="arm64"
          ARCHS=$(lipo -archs "$BINARY")
          echo "architectures: $ARCHS"
          [ "$ARCHS" = "$EXPECTED_ARCH" ]
          DEFINED=$(nm -U "$BINARY" | wc -l | tr -d ' ')
          echo "defined symbols: $DEFINED"
          [ "$DEFINED" -le 10 ]
